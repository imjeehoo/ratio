  /* Layout: display on top, flexible space, then entry controls pinned to the bottom.
     Colours follow the system appearance; light is the default. */
  :root {
    --page: #f2f2f7;
    --surface: #ffffff;
    --ink: #1c1c1e;
    --muted: #6e6e73;
    --faint: #c7c7cc;
    --edge: rgb(0 0 0 / 0.1);
    --fill: rgb(0 0 0 / 0.05);
    --press: rgb(0 0 0 / 0.08);
    --danger: #d70015;
    --primary: #1c1c1e;
    --on-primary: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Pretendard, Inter, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --radius: 22px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #000000;
      --surface: #1c1c1e;
      --ink: #f2f2f7;
      --muted: #98989d;
      --faint: #3a3a3c;
      --edge: rgb(255 255 255 / 0.12);
      --fill: rgb(255 255 255 / 0.1);
      --press: rgb(255 255 255 / 0.14);
      --danger: #ff6961;
      --primary: #f2f2f7;
      --on-primary: #000000;
    }
  }
  html, body, #root { height: 100%; box-sizing: border-box; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button, input { font: inherit; color: inherit; }
  button { -webkit-user-select: none; user-select: none; touch-action: manipulation; cursor: pointer; }
  .app {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  /* Glass content layer: the plain page behind the glass. Everything else in a scene sits above it. */
  .backdrop { position: absolute; inset: 0; background: var(--page); pointer-events: none; }
  .app > :not(.backdrop), .history > :not(.backdrop), .history-foot > :not(.backdrop) { position: relative; }
  /* Display */
  .screen {
    min-height: 232px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--edge);
    overflow: hidden;
  }
  .screen-inner { position: relative; width: 100%; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 6px;
  }
  .chip {
    background: var(--fill);
    min-width: 52px;
    height: 52px;
    padding: 0 16px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .item { display: inline-flex; align-items: center; gap: 6px; }
  .chip > span { display: inline-block; }
  .sep {
    color: var(--muted);
    font-size: 18px;
    width: 14px;
    text-align: center;
  }
  .rows { display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr) 96px 56px;
    align-items: center;
    height: 56px;
  }
  .num {
    text-align: center;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .lead { height: 1px; background: var(--faint); margin: 0 16px; }
  .frac {
    display: grid;
    justify-items: center;
    align-content: center;
    justify-self: center;
    color: var(--muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .frac .bar { justify-self: stretch; min-width: 18px; height: 1.5px; background: currentColor; margin: 2px 0; }
  .all { text-align: center; color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: 0.02em; }
  .pct {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Controls */
  .pad { padding: 0 16px; }
  .top-actions { display: grid; grid-template-columns: 1fr 1fr 52px; gap: 10px; margin-top: 12px; }
  .btn, .add, .main, .field-wrap, .entry-card {
    border: 1px solid var(--edge);
    background: var(--surface);
    border-radius: var(--radius);
  }
  .btn {
    min-height: 52px;
    font-weight: 600;
    font-size: 17px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 12px;
  }
  .btn:active:not(:disabled), .entry-card:active { background: var(--press); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.danger { color: var(--danger); }
  .btn.icon { padding: 0; }
  .btn svg { width: 24px; height: 24px; flex: none; }
  .spacer { flex: 1 1 auto; min-height: 12px; }
  .entry { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 10px; }
  .field-wrap { display: block; min-width: 0; min-height: 52px; }
  .field-wrap:focus-within { border-color: var(--ink); }
  .field {
    display: block;
    width: 100%;
    height: 50px;
    border: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    padding: 0 18px;
    font-size: 18px;
    font-weight: 600;
    outline: none;
  }
  .field::placeholder { color: var(--muted); font-weight: 400; opacity: 1; }
  .add, .main {
    border-color: transparent;
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 600;
    font-size: 17px;
  }
  .add:disabled, .main:disabled { opacity: 0.35; cursor: default; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .quick .btn { min-height: 52px; font-size: 24px; font-variant-numeric: tabular-nums; }
  .main { margin-top: 12px; width: 100%; min-height: 56px; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* Liquid Glass: glass.js adds .lg-surface to each element it turns into glass, so these rules only
     apply where glass is actually rendered. The material supplies fill and edge; text keeps the theme. */
  .lg-surface { --lg-foreground: var(--ink); }
  .btn.lg-surface, .add.lg-surface, .main.lg-surface, .field-wrap.lg-surface, .entry-card.lg-surface {
    background: transparent;
    border-color: transparent;
    color: var(--ink);
  }
  .btn.danger.lg-surface { color: var(--danger); }
  .add.lg-surface, .main.lg-surface { --lg-foreground: var(--on-primary); color: var(--on-primary); }
  .btn.lg-surface:active:not(:disabled), .entry-card.lg-surface:active { background: transparent; }
  /* Fade the label, not the glass, so disabled controls still read as glass. */
  .lg-surface:disabled { opacity: 1; }
  .btn.lg-surface:disabled > * , .btn.lg-surface:disabled { color: color-mix(in srgb, currentColor 35%, transparent); }
  .btn.danger.lg-surface:disabled { color: color-mix(in srgb, var(--danger) 35%, transparent); }
  .add.lg-surface:disabled, .main.lg-surface:disabled { color: color-mix(in srgb, var(--on-primary) 45%, transparent); }
  .field-wrap.lg-surface:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* History (in memory only) */
  .history {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--page);
    display: flex;
    flex-direction: column;
  }
  .history[hidden] { display: none; }
  .history-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .history-list > :first-child { margin-top: auto; }
  .history-empty {
    margin: auto;
    color: var(--muted);
    font-size: 17px;
    text-align: center;
  }
  /* Glass on cards scrolled out of the list is not clipped by its overflow; these opaque bars,
     stacked above the list, cover it. The footer is its own glass scene so its button draws above. */
  .history-cap, .history-foot { z-index: 1; background: var(--page); }
  .history-cap { flex: none; height: env(safe-area-inset-top, 0px); }
  .history-foot {
    padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .history-foot .main { margin-top: 0; }
  .entry-card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    text-align: left;
    width: 100%;
    flex: none;
    padding: 16px 18px;
  }
